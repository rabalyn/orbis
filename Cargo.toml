[package]
name = "orbis"
version = "0.1.0"
edition = "2021"
description = "Globe viewer for Linux, fed from open map data"
publish = false

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19.0"
dirs = "6"
earcut = "0.4.12"
font8x8 = "0.3"
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pollster = "0.4"
tiny-skia = "0.12.0"
ureq = "3"
wgpu = "30"
winit = "0.30"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
