[package]
name = "orbis"
version = "0.1.0"
edition = "2021"
description = "Globe viewer for Linux, fed from open map data"
publish = false

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19.0"
earcut = "0.4.12"
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false }
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
quick-xml = { version = "0.42.0", default-features = false }
serde_json = "1"
tiny-skia = "0.12.0"
wgpu = "30"
winit = "0.30"
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6"
pollster = "0.4"
socket2 = { version = "0.6", features = ["all"] }
ureq = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["webgl"] }
wasm-bindgen = "0.2.130"
web-time = "1"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "Storage", "XmlHttpRequest", "XmlHttpRequestResponseType", "Request", "RequestInit", "RequestMode", "Response", "Headers", "Performance", "console", "AbortSignal", "HtmlElement", "CssStyleDeclaration", "UrlSearchParams", "Navigator", "HtmlCanvasElement"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
